name: "Aetheris CI"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Run lint
        run: pnpm lint
        continue-on-error: true
      - name: Run typecheck
        run: pnpm typecheck
        continue-on-error: true
      - name: Run test
        run: pnpm test
