[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-agents"
version = "2.0.0"
description = "Aetheris v2.0 Multi-Agent System"
authors = [
    {name = "Aryaman Dev"}
]
requires-python = ">=3.10"
dependencies = [
    "google-antigravity>=0.1.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
