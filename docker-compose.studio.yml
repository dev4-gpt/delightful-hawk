version: '3.8'

services:
  # Aetheris World Studio - Web Application & Dispatch Gateway
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetheris-studio
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - AETHERIS_MODE=hybrid
      - LOCAL_GPU_ENDPOINT=http://wan2gp-worker:8188
      - VOXCPM_ENDPOINT=http://voxcpm-worker:8080
      - REDIS_URL=redis://redis-queue:6379
    depends_on:
      - redis-queue
    networks:
      - aetheris-network

  # Wan2GP Video Inference Worker (Wan 2.1 14B / 1.3B, SkyReels, Flux)
  wan2gp-worker:
    image: ghcr.io/deepbeepmeep/wan2gp:latest
    container_name: aetheris-wan2gp-worker
    restart: unless-stopped
    ports:
      - "8188:8188"
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --fp8_e4m3fn --gpu-only
    volumes:
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - aetheris-network

  # VoxCPM Vocal Performance & Zero-Shot Speech Worker
  voxcpm-worker:
    image: ghcr.io/openbmb/voxcpm:latest
    container_name: aetheris-voxcpm-worker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models/voxcpm:/workspace/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aetheris-network

  # Task Queue & State Management
  redis-queue:
    image: redis:7-alpine
    container_name: aetheris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aetheris-network

networks:
  aetheris-network:
    driver: bridge

volumes:
  redis-data:
