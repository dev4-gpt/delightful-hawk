apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aetheris-gateway
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/aetheris-gateway:latest
          resources:
            limits:
              cpu: '2'
              memory: '2Gi'
          ports:
            - containerPort: 3001
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: GCP_PROJECT_ID
                  key: 'latest'
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: 'latest'
            - name: CESIUM_ION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: CESIUM_ION_TOKEN
                  key: 'latest'
